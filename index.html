<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c18">
<meta name="app-version" content="20260528172048">
<title>GastoSmart 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c18;--surface:#0f1629;--surface2:#151e35;--surface3:#1c2640;
  --border:rgba(255,255,255,0.08);--accent:#7c6fff;--accent2:#a78bfa;
  --text:#eef0ff;--muted:#8892c8;--muted2:#3d4a70;
  --green:#2dd4a0;--red:#ff6b7a;--amber:#ffb340;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}

/* ── AUTH ── */
#authScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:380px}
.auth-logo{text-align:center;margin-bottom:20px}
.auth-logo svg{width:48px;height:48px}
.auth-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.auth-sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:24px}
.auth-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:20px;gap:3px}
.auth-tab{flex:1;padding:8px;border-radius:8px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.auth-tab.active{background:var(--surface3);color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.field input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:.2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,111,255,.15)}
.field input::placeholder{color:var(--muted2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:.2s;width:100%}
.btn-primary{background:linear-gradient(135deg,#7c6fff,#6050e0);color:#fff;margin-bottom:12px}
.btn-primary:hover{opacity:.9}
.btn-google{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-google:hover{background:var(--surface3)}
.auth-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:11px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.auth-msg.error{background:rgba(255,107,122,.1);border:1px solid rgba(255,107,122,.2);color:var(--red)}
.auth-msg.success{background:rgba(45,212,160,.1);border:1px solid rgba(45,212,160,.2);color:var(--green)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh}

/* Top Nav */
.topnav{position:sticky;top:0;z-index:100;height:58px;background:rgba(8,12,24,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topnav-brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.topnav-brand svg{width:28px;height:28px;background:linear-gradient(135deg,#7c6fff,#2dd4a0);border-radius:8px;padding:4px}
.topnav-spacer{flex:1}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7c6fff,#f472b6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:2px solid rgba(124,111,255,.3);position:relative}
.avatar-menu{position:absolute;top:40px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;min-width:180px;display:none;z-index:200;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.avatar-menu.open{display:block}
.avatar-menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text);text-decoration:none;transition:.15s}
.avatar-menu a:hover{background:var(--surface2)}
.avatar-menu a.danger{color:var(--red)}

/* Body */
.app-body{display:flex;flex:1;min-height:0}

/* Sidebar */
.sidebar{width:220px;flex-shrink:0;background:rgba(8,12,24,.8);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.sidebar-section{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.15em;padding:10px 10px 5px;opacity:.7}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;width:100%;text-align:left;transition:.2s;font-family:inherit}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:rgba(124,111,255,.15);color:var(--accent2);font-weight:600}
.nav-btn svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(45,212,160,.15);color:var(--green)}

/* Main content */
.main{flex:1;padding:24px 28px;overflow-y:auto;min-height:0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.card-title svg{width:15px;height:15px;color:var(--accent)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.metric-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.metric-value{font-size:20px;font-weight:700;margin-bottom:4px}
.metric-sub{font-size:11px;color:var(--muted)}
.metric.income{border-left:3px solid var(--green)}
.metric.expense{border-left:3px solid var(--red)}
.metric.balance{border-left:3px solid var(--accent)}
.metric.savings{border-left:3px solid var(--amber)}

/* Grid layouts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}

/* Page header */
.page-header{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;margin-bottom:3px}
.page-sub{font-size:13px;color:var(--muted)}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:9px;width:auto;display:inline-flex}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:rgba(255,255,255,.02)}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.chip-green{background:rgba(45,212,160,.12);color:var(--green)}
.chip-red{background:rgba(255,107,122,.12);color:var(--red)}
.chip-purple{background:rgba(124,111,255,.12);color:var(--accent2)}
.chip-amber{background:rgba(255,179,64,.12);color:var(--amber)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;transform:translateY(16px);transition:.2s}
.modal-bg.open .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:700}
.close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.close-btn:hover{background:var(--surface2);color:var(--text)}
.type-toggle{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:18px}
.type-btn{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:.2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.type-btn.ag{background:linear-gradient(135deg,#ff6b7a,#ef4444);color:#fff}
.type-btn.ai{background:linear-gradient(135deg,#2dd4a0,#10b981);color:#fff}
select.field-input,input.field-input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:.2s;margin-bottom:14px}
select.field-input:focus,input.field-input:focus{border-color:var(--accent)}
select.field-input option{background:var(--surface2)}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn-outline{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:auto;padding:8px 16px;font-size:13px;border-radius:9px}

/* TC Cards */
.tc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tc-card{border-radius:14px;padding:18px;color:#fff;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.tc-card:hover{transform:translateY(-3px)}

/* Progress */
.progress{height:5px;background:var(--surface3);border-radius:20px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:20px;transition:width .8s ease}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.3;margin-bottom:12px}

/* Alert */
.alert{padding:12px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.alert svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}
.alert-warning{background:rgba(255,179,64,.08);border:1px solid rgba(255,179,64,.2);color:#ffd077}
.alert-danger{background:rgba(255,107,122,.08);border:1px solid rgba(255,107,122,.2);color:#ff9aa5}
.alert-info{background:rgba(124,111,255,.08);border:1px solid rgba(124,111,255,.2);color:#c4b5fd}

/* Mobile nav */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,24,.95);border-top:1px solid var(--border);z-index:100;padding:6px 0}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 10px;border:none;background:none;font-family:inherit}
.mob-btn svg{width:20px;height:20px}
.mob-btn.active{color:var(--accent2)}

/* Responsive */
@media(max-width:900px){
  .sidebar{display:none}
  .main{padding:16px 14px 90px}
  .mobile-nav{display:block}
  .metrics{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .tc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  .metrics{grid-template-columns:1fr 1fr}
  .tc-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      Continuar con Google
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- Top Nav -->
  <nav class="topnav">
    <div class="topnav-brand">
      <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="url(#ng)"/><defs><linearGradient id="ng" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#7c6fff"/><stop offset="1" stop-color="#2dd4a0"/></linearGradient></defs><rect x="4" y="18" width="3.5" height="6" rx="1" fill="white" opacity=".9"/><rect x="9" y="14" width="3.5" height="10" rx="1" fill="white"/><rect x="14" y="9" width="3.5" height="15" rx="1" fill="white"/><rect x="19" y="12" width="3.5" height="12" rx="1" fill="white" opacity=".9"/></svg>

    </div>

  <!-- Body -->
  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">Principal</div>
      <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">

        Dashboard
      </button>
      <button class="nav-btn" data-page="transactions" onclick="navigate('transactions')">

      </button>
      <button class="nav-btn" data-page="budget" onclick="navigate('budget')">

      </button>

      <button class="nav-btn" data-page="ai" onclick="navigate('ai')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
        Asistente IA
      </button>
      <div class="sidebar-section" style="margin-top:auto">Cuenta</div>
      <button class="nav-btn" data-page="premium" onclick="navigate('premium')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Premium
        <span style="margin-left:auto;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:linear-gradient(135deg,#ffb340,#f97316);color:#fff">PRO</span>
      </button>
      <button class="nav-btn" data-page="settings" onclick="navigate('settings')">

  persistSession:!isEdge,autoRefreshToken:true

// ─── STATE ──────────────────────────────────────────────
let user=null,txs=[],tarjetas=[],page='dashboard',txType='gasto',editTcId=null,userBudgets={};

// ─── AUTH ────────────────────────────────────────────────
let authMode='login';
function switchTab(m){
  authMode=m;
  document.getElementById('tabLogin').classList.toggle('active',m==='login');
  document.getElementById('tabRegister').classList.toggle('active',m==='register');
  document.getElementById('authBtn').textContent=m==='login'?'Iniciar sesión':'Crear cuenta';
  document.getElementById('nameField').style.display=m==='register'?'block':'none';
  setMsg('','');
}
function setMsg(text,type){
  const el=document.getElementById('authMsg');
  el.textContent=text;el.className='auth-msg'+(type?' '+type:'');
  el.style.display=text?'block':'none';
}
async function doAuth(){
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPassword').value;
  const name=document.getElementById('authName').value.trim();
  if(!email||!pass){setMsg('Ingresa correo y contraseña','error');return}
  if(pass.length<6){setMsg('Contraseña mínimo 6 caracteres','error');return}
  const btn=document.getElementById('authBtn');
  btn.innerHTML='<div class="spinner"></div>';btn.disabled=true;
  try{
    if(authMode==='register'){
      if(!name){setMsg('Ingresa tu nombre','error');btn.innerHTML='Crear cuenta';btn.disabled=false;return}
      const{error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
      if(error)throw error;
      setMsg('¡Cuenta creada! Revisa tu correo para confirmar.','success');
    }else{
      const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      user=data.user;await initApp();return;
    }
  }catch(e){
    const msg=e.message.includes('invalid_credentials')||e.message.includes('Invalid login')?'Correo o contraseña incorrectos':
    e.message.includes('already registered')?'Este correo ya tiene cuenta':
    e.message.includes('Email not confirmed')?'Confirma tu correo antes de entrar':e.message;
    setMsg(msg,'error');
  }
  btn.innerHTML=authMode==='login'?'Iniciar sesión':'Crear cuenta';btn.disabled=false;
}
async function doGoogle(){
  const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});
  if(error)setMsg(error.message,'error');
}
async function doSignOut(){
  // scope:'local' cierra la sesion al instante, sin llamada de red (no se cuelga)
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  try{localStorage.clear()}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  // marca de logout: sobrevive la recarga y obliga a mostrar login
  try{sessionStorage.setItem('gs_logout','1')}catch(e){}
  user=null;txs=[];tarjetas=[];
  // Recarga forzada (parametro cambiante garantiza el reload) a URL limpia
  window.location.replace(window.location.origin+window.location.pathname+'?_out='+Date.now());
}

// ─── INIT ────────────────────────────────────────────────
async function initApp(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  const name=user.user_metadata?.name||user.email||'Usuario';
  const initials=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('avatarInitials').textContent=initials;
  navigate('dashboard');
  try{
    await ensureProfile(name);
    await loadBudgets();
    await loadTxs();
    await loadTarjetas();
    navigate('dashboard');
  }catch(e){console.log('Error cargando datos:',e)}
}
async function ensureProfile(name){
  const{data}=await sb.from('profiles').select('id').eq('id',user.id).single();
  if(!data)await sb.from('profiles').insert({id:user.id,name,currency:'MXN'});
}
async function loadTxs(){
  const{data,error}=await sb.from('transactions').select('*').eq('user_id',user.id).order('date',{ascending:false});
  if(!error&&data)txs=data;
}
async function loadTarjetas(){
  try{
    const{data,error}=await sb.from('tarjetas').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(!error&&data&&data.length>0)tarjetas=data;
    else tarjetas=JSON.parse(store.getItem('gs_tarjetas')||'[]');
  }catch(e){tarjetas=JSON.parse(store.getItem('gs_tarjetas')||'[]')}
}
async function loadBudgets(){
  try{
    const{data}=await sb.from('profiles').select('budgets').eq('id',user.id).single();
    userBudgets=(data&&data.budgets&&Object.keys(data.budgets).length)?data.budgets:{...BUDGETS};
  }catch(e){userBudgets={...BUDGETS};}
}
function collectBudgetInputs(){
  const next={};
  document.querySelectorAll('[data-budget-cat]').forEach(i=>{
    const v=parseFloat(i.value);
    next[i.dataset.budgetCat]=(isNaN(v)||v<0)?0:v;
  });
  return next;
}
function addBudgetCat(){
  userBudgets=collectBudgetInputs();
  const sel=document.getElementById('newBudgetCat');
  const c=sel&&sel.value;
  if(c&&!(c in userBudgets))userBudgets[c]=0;
  navigate('budget');
}
function removeBudgetCat(c){
  userBudgets=collectBudgetInputs();
  delete userBudgets[c];
  navigate('budget');
}
async function saveBudgets(){
  userBudgets=collectBudgetInputs();
  const btn=document.getElementById('saveBudgetBtn');
  if(btn){btn.textContent='Guardando...';btn.disabled=true;}
  try{
    const{error}=await sb.from('profiles').update({budgets:userBudgets}).eq('id',user.id);
    if(error)throw error;
    if(btn){btn.textContent='✓ Guardado';setTimeout(()=>{if(btn){btn.textContent='💾 Guardar';btn.disabled=false;}},1500);}
  }catch(e){
    if(btn){btn.textContent='Error al guardar';btn.disabled=false;}
  }
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(isEdge)return;
  if(sessionStorage.getItem('gs_logout'))return; // acabamos de cerrar sesion: no auto-entrar
  if(event==='SIGNED_IN'&&session?.user&&!user){user=session.user;await initApp();}
  if(event==='SIGNED_OUT'){user=null;showLogin();}
});

async function start(){
  if(isEdge){showLogin();return;}
  showLogin();
  // Si venimos de cerrar sesion, forzar login y limpiar cualquier rastro
  if(sessionStorage.getItem('gs_logout')){
    sessionStorage.removeItem('gs_logout');
    try{await sb.auth.signOut({scope:'local'})}catch(e){}
    history.replaceState(null,'',location.origin+location.pathname);
    return;
  }
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session?.user){user=session.user;await initApp();}
  }catch(e){}
}
function showLogin(){
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}

// ─── TRANSACTIONS ────────────────────────────────────────
async function addTx(tx){
  const{data,error}=await sb.from('transactions').insert({...tx,user_id:user.id}).select().single();
  if(!error&&data){txs.unshift(data);return true;}return false;
}
async function delTx(id){
  const{error}=await sb.from('transactions').delete().eq('id',id).eq('user_id',user.id);
  if(!error){txs=txs.filter(t=>t.id!==id);return true;}return false;
}

// ─── TARJETAS ─────────────────────────────────────────────
async function addTarjeta(tc){
  try{
    const{data,error}=await sb.from('tarjetas').insert({...tc,user_id:user.id}).select().single();
    if(!error&&data){tarjetas.unshift(data);store.setItem('gs_tarjetas',JSON.stringify(tarjetas));return true;}
  }catch(e){}
  tc.id=Date.now();tarjetas.unshift(tc);store.setItem('gs_tarjetas',JSON.stringify(tarjetas));return true;
}
async function updateTarjeta(tc){
  try{await sb.from('tarjetas').update(tc).eq('id',tc.id).eq('user_id',user.id);}catch(e){}
  tarjetas=tarjetas.map(t=>t.id===tc.id?tc:t);
  store.setItem('gs_tarjetas',JSON.stringify(tarjetas));return true;
}
async function delTarjeta(id){
  try{await sb.from('tarjetas').delete().eq('id',id);}catch(e){}
  tarjetas=tarjetas.filter(t=>t.id!==id);
  store.setItem('gs_tarjetas',JSON.stringify(tarjetas));
}

function monthTxs(){const n=new Date();return txs.filter(t=>{const d=new Date(t.date+'T12:00:00');return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()});}

// ─── NAVIGATE ─────────────────────────────────────────────
function navigate(p){
  page=p;
  document.querySelectorAll('.nav-btn,.mob-btn').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===p);
  });
  document.getElementById('mainContent').innerHTML=PAGES[p]?PAGES[p]():renderDashboard();
  afterRender(p);
  window.scrollTo(0,0);
  document.getElementById('avatarMenu').classList.remove('open');
}
function toggleMenu(){document.getElementById('avatarMenu').classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.avatar-btn'))document.getElementById('avatarMenu').classList.remove('open');});

// ─── MODAL ────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function checkCustomCat(v){document.getElementById('customCatWrap').style.display=v==='__custom__'?'block':'none';}
function setType(t){
  txType=t;
  document.getElementById('typeGasto').className='type-btn'+(t==='gasto'?' ag':'');
  document.getElementById('typeIngreso').className='type-btn'+(t==='ingreso'?' ai':'');
}
function openTxModal(){
  document.getElementById('txDesc').value='';
  document.getElementById('txAmount').value='';
  document.getElementById('txDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('txNote').value='';
  document.getElementById('txCat').value='Alimentación';
  document.getElementById('customCatWrap').style.display='none';
  setType('gasto');
  openModal('txModal');
}
async function saveTx(){
  const desc=document.getElementById('txDesc').value.trim();
  const amount=parseFloat(document.getElementById('txAmount').value);
  const date=document.getElementById('txDate').value;
  const selCat=document.getElementById('txCat').value;
  const customCat=document.getElementById('customCat').value.trim();
  const category=selCat==='__custom__'&&customCat?customCat:selCat;
  const note=document.getElementById('txNote').value.trim();
  if(!desc||!amount||!date){alert('Completa descripción, monto y fecha');return;}
  const btn=event.target;btn.textContent='Guardando...';btn.disabled=true;
  const ok=await addTx({type:txType,description:desc,amount,category,date,note});
  btn.textContent='Guardar';btn.disabled=false;
  if(ok){closeModal('txModal');navigate(page);}
  else alert('Error al guardar. Intenta de nuevo.');
}
window.delTxHandler=async id=>{if(!confirm('¿Eliminar transacción?'))return;await delTx(id);navigate(page);};

// TC Modal
function openTcModal(tc=null){
  editTcId=tc?tc.id:null;
  document.getElementById('tcModalTitle').textContent=tc?'Editar Tarjeta':'Nueva Tarjeta';
  const fields={tcBanco:'banco',tcNombre:'nombre',tcDigitos:'digitos',tcLimite:'limite',tcSaldo:'saldo',tcMinimo:'minimo',tcCorte:'dia_corte',tcPago:'dia_pago',tcTasa:'tasa'};
  Object.entries(fields).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.value=tc?tc[key]||'':'';});
  openModal('tcModal');
}
async function saveTc(){
  const banco=document.getElementById('tcBanco').value;
  const nombre=document.getElementById('tcNombre').value.trim();
  if(!banco||!nombre){alert('Selecciona banco e ingresa un nombre');return;}
  const tc={
    banco,nombre,
    digitos:document.getElementById('tcDigitos').value.trim(),
    limite:parseFloat(document.getElementById('tcLimite').value)||0,
    saldo:parseFloat(document.getElementById('tcSaldo').value)||0,
    minimo:parseFloat(document.getElementById('tcMinimo').value)||0,
    dia_corte:parseInt(document.getElementById('tcCorte').value)||null,
    dia_pago:parseInt(document.getElementById('tcPago').value)||null,
    tasa:parseFloat(document.getElementById('tcTasa').value)||null
  };
  if(editTcId){tc.id=editTcId;await updateTarjeta(tc);}
  else await addTarjeta(tc);
  closeModal('tcModal');navigate('tarjetas');
}
window.editTcHandler=tc=>openTcModal(tc);
window.delTcHandler=async id=>{if(!confirm('¿Eliminar tarjeta?'))return;await delTarjeta(id);navigate('tarjetas');};

  const proxVenc=tarjetas.filter(t=>t.dia_pago&&diasPara(t.dia_pago)<=10).sort((a,b)=>diasPara(a.dia_pago)-diasPara(b.dia_pago));

  <div class="page-header">
    <div>
      <div class="page-title">Mis Tarjetas de Crédito</div>

    <button class="btn btn-primary" style="width:auto;margin:0 auto" onclick="openTcModal()">+ Agregar primera tarjeta</button>
  </div>`}`;
}

async function saveProfile(){
  const name=document.getElementById('settingsName').value.trim();
  if(!name)return;
  await sb.auth.updateUser({data:{name}});
  await sb.from('profiles').update({name}).eq('id',user.id);
  user.user_metadata.name=name;
  const initials=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('avatarInitials').textContent=initials;
  alert('✓ Perfil actualizado');
}

function getCatEmoji(cat){
  const map={'Alimentación':'🛒','Restaurantes':'🍽️','Transporte':'🚌','Gasolina':'⛽','Vivienda':'🏠','Ropa':'👕','Salud':'💊','Consulta médica':'🏥','Entretenimiento':'🎮','Streaming':'📺','Viajes':'✈️','Educación':'📚','Ahorro':'💰','Inversión':'📈','Salario':'💵','Freelance':'💻','Negocio':'🏪','Deuda TC':'💳','Otros':'📦'};
  return map[cat]||'📦';
}

function aiTips(cats,income,expense){
  const tips=[];
  const ratio=income>0?expense/income:0;
  const sp=income>0?Math.round(((income-expense)/income)*100):0;
  if(ratio>.85)tips.push({t:'warning',m:'Gastas más del 85% de tus ingresos. Considera reducir gastos no esenciales.'});
  if((cats['Alimentación']||0)>2500)tips.push({t:'warning',m:'Alimentación está sobre el promedio. Cocinar en casa puede reducirlo 40%.'});
  if(sp<10&&income>0)tips.push({t:'danger',m:'Tu ahorro está bajo. La regla 50/30/20 recomienda al menos 20%.'});
  if(tips.length===0)tips.push({t:'success',m:'¡Excelentes finanzas este mes! Estás en parámetros saludables.'});
  tips.push({t:'info',m:'Activa Premium para análisis predictivo y chat con IA financiera.'});
  const icons={warning:'⚠️',danger:'🚨',success:'✅',info:'💡'};
  const colors={warning:'alert-warning',danger:'alert-danger',success:'',info:'alert-info'};
  return tips.map(t=>`<div class="alert ${colors[t.t]}" style="${t.t==='success'?'background:rgba(45,212,160,.08);border:1px solid rgba(45,212,160,.2);color:#5fe8c0':''}"><span>${icons[t.t]}</span><span>${t.m}</span></div>`).join('');
}

function afterRender(p){
  if(p==='transactions'){
    const doFilter=()=>{
      const q=document.getElementById('fSearch').value.toLowerCase();
      const type=document.getElementById('fType').value;
      const filtered=txs.filter(t=>(!q||t.description.toLowerCase().includes(q)||t.category.toLowerCase().includes(q))&&(!type||t.type===type));
      document.getElementById('txTableWrap').innerHTML=txTable(filtered);
    };
    document.getElementById('fSearch').addEventListener('input',doFilter);
    document.getElementById('fType').addEventListener('change',doFilter);
  }
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{}};
  if(p==='dashboard'){
    const cats=byCat(monthTxs()),labels=Object.keys(cats),data=Object.values(cats),colors=labels.map(l=>CATS[l]||'#888');
    const el=document.getElementById('catChart');
    if(el&&labels.length)new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors.map(c=>c+'99'),borderColor:colors,borderWidth:2}]},options:{...opts,cutout:'65%'}});
  }
  if(p==='reports'){
    const cats=byCat(monthTxs()),labels=Object.keys(cats),data=Object.values(cats),colors=labels.map(l=>CATS[l]||'#888');
    if(labels.length){
      const pie=document.getElementById('pieChart');
      if(pie)new Chart(pie,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors.map(c=>c+'cc'),borderColor:'transparent',borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#8892c8',font:{size:11},padding:10}}}}});
      const bar=document.getElementById('barChart');
      if(bar)new Chart(bar,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors.map(c=>c+'88'),borderColor:colors,borderWidth:1,borderRadius:6}]},options:{...opts,scales:{x:{ticks:{color:'#8892c8'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#8892c8',callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(255,255,255,.04)'}}}}});
    }
    const line=document.getElementById('lineChart');
    if(line)new Chart(line,{type:'line',data:{labels:['Ago','Sep','Oct','Nov','Dic','Ene'],datasets:[{label:'Ingresos',data:[14000,13500,15000,14500,16000,17000],borderColor:'#2dd4a0',backgroundColor:'rgba(45,212,160,.06)',fill:true,tension:.4,pointRadius:4},{label:'Gastos',data:[11000,12000,12500,11800,13200,14000],borderColor:'#ff6b7a',backgroundColor:'rgba(255,107,122,.06)',fill:true,tension:.4,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8892c8',font:{size:12}}}},scales:{x:{ticks:{color:'#8892c8'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#8892c8',callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(255,255,255,.04)'}}}}});
  }
}

// Auto-actualización: detecta nueva versión y limpia caché automáticamente
(function(){
  // Fuente única de versión: la etiqueta <meta name="app-version">.
  // actualizar.bat la cambia en cada deploy, así nunca se desincroniza.
  var meta = document.querySelector('meta[name="app-version"]');
  var BUILD = meta ? meta.getAttribute('content') : '0';
  var stored = localStorage.getItem('gs_version');
  if (stored && stored !== BUILD) {
    // Nueva versión detectada. Conservamos la sesión de Supabase (no cerramos sesión).
    // Si algún día necesitas limpiar datos cacheados incompatibles, hazlo aquí.
  }
  try { localStorage.setItem('gs_version', BUILD); } catch(e){}
  start();
})();
</script>
