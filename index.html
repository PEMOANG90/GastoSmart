<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GastoSmart – Control de Gastos Personales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --green-50: #e8faf2; --green-100: #b6f0d5; --green-400: #22c77a; --green-500: #17a862;
    --green-600: #0e8a4f; --green-800: #06512e; --green-900: #03301a;
    --amber-50: #fef9ec; --amber-100: #fde8b0; --amber-400: #f5a623; --amber-600: #c07d10;
    --red-50: #fef2f2; --red-400: #e84040; --red-600: #b52525;
    --blue-50: #eff6ff; --blue-400: #3b82f6; --blue-600: #1d4ed8;
    --purple-50: #f5f3ff; --purple-400: #8b5cf6; --purple-600: #6d28d9;
    --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db;
    --gray-400: #9ca3af; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827;
    --bg: #f0f2f5; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --radius: 16px; --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.10);
  }
  [data-theme="dark"] {
    --bg: #0f1117; --card: #1a1d27; --text: #f1f5f9; --muted: #94a3b8;
    --gray-100: #1e2130; --gray-200: #2a2f45; --gray-300: #374151; --gray-400: #6b7280;
    --green-50: #0a2318; --green-100: #0f3a28; --amber-50: #1f1504;
    --red-50: #1f0808; --blue-50: #0e1a35; --purple-50: #1a1035;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; font-size: 14px; transition: background .3s, color .3s;
  }
  /* NAV */
  nav {
    background: var(--card); border-bottom: 1px solid var(--gray-200);
    padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
    height: 60px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 8px rgba(0,0,0,.06);
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .nav-brand .logo {
    width: 34px; height: 34px; background: var(--green-400); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
  }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .btn-icon {
    background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px;
    color: var(--muted); font-size: 18px; transition: background .2s, color .2s;
  }
  .btn-icon:hover { background: var(--gray-100); color: var(--text); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--green-400);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  /* SIDEBAR */
  .layout { display: flex; min-height: calc(100vh - 60px); }
  .sidebar {
    width: 220px; background: var(--card); border-right: 1px solid var(--gray-200);
    padding: 20px 12px; display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto;
    flex-shrink: 0;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: all .2s; border: none; background: none; width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--gray-100); color: var(--text); }
  .nav-item.active { background: var(--green-50); color: var(--green-600); }
  .nav-item .icon { font-size: 16px; width: 20px; }
  .nav-section { font-size: 10px; font-weight: 600; color: var(--gray-400); text-transform: uppercase;
    letter-spacing: .08em; padding: 16px 12px 6px; }
  .badge-pro {
    margin-left: auto; background: var(--amber-100); color: var(--amber-600);
    font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  /* MAIN */
  .main { flex: 1; padding: 28px 32px; overflow-y: auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  /* CARDS */
  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px 24px;
    box-shadow: var(--shadow); border: 1px solid var(--gray-200);
  }
  .card-sm { border-radius: var(--radius-sm); padding: 16px 18px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  /* METRIC CARD */
  .metric-card {
    background: var(--card); border-radius: var(--radius-sm); padding: 18px 20px;
    border: 1px solid var(--gray-200); box-shadow: var(--shadow);
  }
  .metric-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
  .metric-value { font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  .metric-sub { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .trend-up { color: var(--red-400); }
  .trend-down { color: var(--green-400); }
  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s; border: none; font-family: 'Sora', sans-serif;
  }
  .btn-primary { background: var(--green-400); color: #fff; }
  .btn-primary:hover { background: var(--green-500); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,199,122,.3); }
  .btn-outline { background: none; border: 1px solid var(--gray-300); color: var(--text); }
  .btn-outline:hover { background: var(--gray-100); }
  .btn-danger { background: none; border: 1px solid var(--red-400); color: var(--red-400); }
  .btn-danger:hover { background: var(--red-50); }
  /* INPUTS */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .form-input {
    width: 100%; padding: 10px 14px; border: 1px solid var(--gray-300);
    border-radius: 10px; font-size: 14px; background: var(--bg); color: var(--text);
    font-family: 'Sora', sans-serif; transition: border .2s, box-shadow .2s;
    outline: none;
  }
  .form-input:focus { border-color: var(--green-400); box-shadow: 0 0 0 3px rgba(34,199,122,.15); }
  select.form-input { cursor: pointer; }
  /* TABLE */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--gray-200); text-align: left; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--gray-100); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }
  /* CHIPS */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
    border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .chip-green { background: var(--green-50); color: var(--green-600); }
  .chip-red { background: var(--red-50); color: var(--red-600); }
  .chip-amber { background: var(--amber-50); color: var(--amber-600); }
  .chip-blue { background: var(--blue-50); color: var(--blue-600); }
  .chip-purple { background: var(--purple-50); color: var(--purple-600); }
  /* PROGRESS */
  .progress-bar { height: 8px; background: var(--gray-200); border-radius: 20px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 20px; transition: width .6s ease; }
  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--card); border-radius: var(--radius); padding: 28px; width: 100%;
    max-width: 480px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 18px; font-weight: 700; }
  /* ALERT */
  .alert {
    padding: 14px 18px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5;
    display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px;
  }
  .alert-warning { background: var(--amber-50); border-left: 3px solid var(--amber-400); }
  .alert-success { background: var(--green-50); border-left: 3px solid var(--green-400); }
  .alert-info { background: var(--blue-50); border-left: 3px solid var(--blue-400); }
  .alert-icon { font-size: 18px; flex-shrink: 0; }
  /* TABS */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--gray-200); margin-bottom: 20px; }
  .tab {
    padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent;
    transition: all .2s; font-family: 'Sora', sans-serif; margin-bottom: -1px;
  }
  .tab.active { color: var(--green-600); border-bottom-color: var(--green-400); }
  /* SECTION HEADING */
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  /* PLAN BADGE */
  .plan-badge {
    background: linear-gradient(135deg, var(--amber-400), #f97316);
    color: #fff; font-size: 10px; font-weight: 700; padding: 3px 10px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: .06em;
  }
  /* EMPTY STATE */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  /* CATEGORY DOT */
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main { padding: 20px 16px; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
  /* TOGGLE */
  .toggle { position: relative; display: inline-block; width: 42px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: var(--gray-300); border-radius: 24px;
    cursor: pointer; transition: .3s;
  }
  .toggle-slider:before {
    content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background: white; border-radius: 50%; transition: .3s;
  }
  .toggle input:checked + .toggle-slider { background: var(--green-400); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }
  /* MOBILE NAV */
  .mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--gray-200);
    padding: 8px 0 max(8px, env(safe-area-inset-bottom)); z-index: 100;
  }
  .mobile-nav-inner { display: flex; justify-content: space-around; }
  .mobile-nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 600; color: var(--muted); cursor: pointer;
    padding: 6px 12px; border: none; background: none; font-family: 'Sora', sans-serif;
    transition: color .2s;
  }
  .mobile-nav-item .icon { font-size: 20px; }
  .mobile-nav-item.active { color: var(--green-500); }
  @media (max-width: 900px) { .mobile-nav { display: block; } .main { padding-bottom: 80px; } }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-brand">
    <div class="logo">💰</div>
    GastoSmart
  </div>
  <div class="nav-right">
    <span style="font-size:11px;color:var(--muted)">v1.0 Beta</span>
    <button class="btn-icon" id="themeToggle" title="Cambiar tema">🌙</button>
    <div class="avatar" title="Mi perfil">TU</div>
  </div>
</nav>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="nav-section">Principal</div>
    <button class="nav-item active" data-page="dashboard"><span class="icon">📊</span> Dashboard</button>
    <button class="nav-item" data-page="transactions"><span class="icon">💳</span> Transacciones</button>
    <button class="nav-item" data-page="budget"><span class="icon">🎯</span> Presupuesto</button>
    <button class="nav-item" data-page="reports"><span class="icon">📈</span> Reportes</button>

    <div class="nav-section">Funciones</div>
    <button class="nav-item" data-page="ai"><span class="icon">🤖</span> Asistente IA</button>
    <button class="nav-item" data-page="shared"><span class="icon">👥</span> Cuentas Compartidas</button>
    <button class="nav-item" data-page="categories"><span class="icon">🏷️</span> Categorías</button>

    <div class="nav-section" style="margin-top:auto">Cuenta</div>
    <button class="nav-item" data-page="premium">
      <span class="icon">⭐</span> Premium
      <span class="badge-pro">Pro</span>
    </button>
    <button class="nav-item" data-page="settings"><span class="icon">⚙️</span> Configuración</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">
    <!-- rendered by JS -->
  </main>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <button class="mobile-nav-item active" data-page="dashboard"><span class="icon">📊</span>Inicio</button>
    <button class="mobile-nav-item" data-page="transactions"><span class="icon">💳</span>Gastos</button>
    <button class="mobile-nav-item" data-page="budget"><span class="icon">🎯</span>Presupuesto</button>
    <button class="mobile-nav-item" data-page="reports"><span class="icon">📈</span>Reportes</button>
    <button class="mobile-nav-item" data-page="ai"><span class="icon">🤖</span>IA</button>
  </div>
</nav>

<!-- ADD TRANSACTION MODAL -->
<div id="addModal" class="modal-bg" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nueva Transacción</span>
      <button class="btn-icon" id="closeModal">✕</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-type="gasto">💸 Gasto</button>
      <button class="tab" data-type="ingreso">💵 Ingreso</button>
    </div>
    <div class="form-group">
      <label class="form-label">Descripción</label>
      <input class="form-input" id="txDesc" placeholder="ej. Supermercado Walmart">
    </div>
    <div class="form-group">
      <label class="form-label">Monto (MXN)</label>
      <input class="form-input" id="txAmount" type="number" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label class="form-label">Categoría</label>
      <select class="form-input" id="txCat">
        <option value="Alimentación">🍔 Alimentación</option>
        <option value="Transporte">🚗 Transporte</option>
        <option value="Vivienda">🏠 Vivienda</option>
        <option value="Salud">🏥 Salud</option>
        <option value="Entretenimiento">🎮 Entretenimiento</option>
        <option value="Educación">📚 Educación</option>
        <option value="Ropa">👕 Ropa</option>
        <option value="Servicios">💡 Servicios</option>
        <option value="Ahorro">🐷 Ahorro</option>
        <option value="Otros">📦 Otros</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Fecha</label>
      <input class="form-input" id="txDate" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">Nota (opcional)</label>
      <input class="form-input" id="txNote" placeholder="Detalles adicionales...">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-outline" id="cancelModal">Cancelar</button>
      <button class="btn btn-primary" id="saveTransaction">✓ Guardar</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA STORE
// ══════════════════════════════════════════════
const CATEGORIES = {
  'Alimentación': { icon: '🍔', color: '#f5a623' },
  'Transporte': { icon: '🚗', color: '#3b82f6' },
  'Vivienda': { icon: '🏠', color: '#8b5cf6' },
  'Salud': { icon: '🏥', color: '#e84040' },
  'Entretenimiento': { icon: '🎮', color: '#22c77a' },
  'Educación': { icon: '📚', color: '#06b6d4' },
  'Ropa': { icon: '👕', color: '#ec4899' },
  'Servicios': { icon: '💡', color: '#f59e0b' },
  'Ahorro': { icon: '🐷', color: '#10b981' },
  'Otros': { icon: '📦', color: '#6b7280' }
};

const sampleTransactions = [
  { id:1, type:'gasto', desc:'Supermercado Walmart', amount:1850, cat:'Alimentación', date:'2025-01-28', note:'' },
  { id:2, type:'gasto', desc:'Gasolina', amount:650, cat:'Transporte', date:'2025-01-27', note:'' },
  { id:3, type:'ingreso', desc:'Salario quincenal', amount:12500, cat:'Otros', date:'2025-01-26', note:'Quincena enero' },
  { id:4, type:'gasto', desc:'Netflix + Spotify', amount:320, cat:'Entretenimiento', date:'2025-01-25', note:'' },
  { id:5, type:'gasto', desc:'Farmacia', amount:480, cat:'Salud', date:'2025-01-24', note:'Medicamentos' },
  { id:6, type:'gasto', desc:'Renta departamento', amount:8500, cat:'Vivienda', date:'2025-01-20', note:'' },
  { id:7, type:'gasto', desc:'Uniforme escolar', amount:1200, cat:'Educación', date:'2025-01-18', note:'' },
  { id:8, type:'ingreso', desc:'Pago freelance', amount:4500, cat:'Otros', date:'2025-01-15', note:'Diseño logo' },
  { id:9, type:'gasto', desc:'Comida restaurante', amount:890, cat:'Alimentación', date:'2025-01-14', note:'' },
  { id:10, type:'gasto', desc:'Metro/Transporte', amount:210, cat:'Transporte', date:'2025-01-13', note:'' },
];

const budgets = { 'Alimentación':3000, 'Transporte':1500, 'Vivienda':9000, 'Salud':1000, 'Entretenimiento':800, 'Educación':2000, 'Ropa':1000, 'Servicios':500 };

let transactions = JSON.parse(localStorage.getItem('gs_txs') || 'null') || sampleTransactions;
let currentPage = 'dashboard';
let addType = 'gasto';
let chartInstances = {};

function saveTx() { localStorage.setItem('gs_txs', JSON.stringify(transactions)); }

function fmtMXN(n) {
  return new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', minimumFractionDigits:0 }).format(n);
}

function getMonthTxs() {
  const now = new Date();
  return transactions.filter(t => {
    const d = new Date(t.date + 'T00:00:00');
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

// ══════════════════════════════════════════════
// PAGES
// ══════════════════════════════════════════════
function renderDashboard() {
  const monthTx = getMonthTxs();
  const totalIncome = monthTx.filter(t=>t.type==='ingreso').reduce((s,t)=>s+t.amount,0);
  const totalExpense = monthTx.filter(t=>t.type==='gasto').reduce((s,t)=>s+t.amount,0);
  const balance = totalIncome - totalExpense;
  const savings = totalIncome > 0 ? Math.round((balance/totalIncome)*100) : 0;

  // By category
  const byCat = {};
  monthTx.filter(t=>t.type==='gasto').forEach(t => { byCat[t.cat] = (byCat[t.cat]||0) + t.amount; });
  const topCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Budget alerts
  const alerts = Object.entries(budgets).map(([cat,limit]) => {
    const spent = byCat[cat] || 0;
    const pct = Math.round((spent/limit)*100);
    return { cat, spent, limit, pct };
  }).filter(a => a.pct > 0).sort((a,b)=>b.pct-a.pct);

  return `
    <div class="row">
      <div>
        <h1>Buenos días 👋</h1>
        <p class="subtitle">Enero 2025 — resumen del mes</p>
      </div>
      <button class="btn btn-primary" id="openAdd">+ Agregar Gasto</button>
    </div>

    <div class="grid-4">
      <div class="metric-card">
        <div class="metric-label">💵 Ingresos del Mes</div>
        <div class="metric-value" style="color:var(--green-500)">${fmtMXN(totalIncome)}</div>
        <div class="metric-sub">✅ Este mes</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💸 Gastos del Mes</div>
        <div class="metric-value" style="color:var(--red-400)">${fmtMXN(totalExpense)}</div>

function renderAITips(byCat, income, expense) {
  const tips = [];
  const alimentacion = byCat['Alimentación'] || 0;
  const entret = byCat['Entretenimiento'] || 0;
  if (income > 0 && expense/income > 0.85) tips.push({ type:'warning', icon:'⚠️', text:'Estás gastando más del 85% de tus ingresos. Considera reducir gastos no esenciales.' });
  if (alimentacion > 2500) tips.push({ type:'info', icon:'💡', text:`Alimentación representa ${fmtMXN(alimentacion)} este mes. Cocinar en casa puede reducirlo hasta un 40%.` });
  if (entret > 500) tips.push({ type:'info', icon:'🎯', text:`Entretenimiento: ${fmtMXN(entret)}. Revisa suscripciones que ya no usas (Netflix, apps, etc).` });
  if (income > 0 && (income-expense)/income < 0.1) tips.push({ type:'warning', icon:'🐷', text:'Tu tasa de ahorro es menor al 10%. La regla 50/30/20 recomienda ahorrar al menos el 20%.' });
  if (tips.length === 0) tips.push({ type:'success', icon:'🎉', text:'¡Excelente! Tus finanzas están bajo control este mes. Sigue así.' });
  tips.push({ type:'info', icon:'🔮', text:'Activa el Plan Premium para recibir análisis predictivos y metas personalizadas con IA avanzada.' });
  return tips.map(t => `
    <div class="alert alert-${t.type==='warning'?'warning':t.type==='success'?'success':'info'}">
      <span class="alert-icon">${t.icon}</span>
      <span>${t.text}</span>
    </div>
  `).join('');
}

// ROUTING & EVENTS
// ══════════════════════════════════════════════
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  const pages = {
    dashboard: renderDashboard, transactions: renderTransactions, budget: renderBudget,
    reports: renderReports, ai: renderAI, shared: renderShared, premium: renderPremium,
    settings: renderSettings, categories: renderCategories
  };
  document.getElementById('mainContent').innerHTML = (pages[page] || renderDashboard)();
  afterRender(page);
  window.scrollTo(0,0);
}

function afterRender(page) {
  document.getElementById('openAdd')?.addEventListener('click', () => showModal());

  // Filter events for transactions page
  if (page === 'transactions') {
    const applyFilter = () => {
      const q = document.getElementById('filterSearch').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const cat = document.getElementById('filterCat').value;
      const filtered = transactions.filter(t =>
        (!q || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q)) &&
        (!type || t.type === type) &&
        (!cat || t.cat === cat)
      );
      document.getElementById('txTable').innerHTML = renderTxTable(filtered);
    };
    document.getElementById('filterSearch')?.addEventListener('input', applyFilter);
    document.getElementById('filterType')?.addEventListener('change', applyFilter);
    document.getElementById('filterCat')?.addEventListener('change', applyFilter);
  }

  // Dark mode toggle in settings
  document.getElementById('darkToggle')?.addEventListener('change', e => {
    document.body.dataset.theme = e.target.checked ? 'dark' : '';
    localStorage.setItem('gs_theme', e.target.checked ? 'dark' : '');
  });

  // Charts
  if (page === 'dashboard') {
    const monthTx = getMonthTxs();
    const byCat = {};
    monthTx.filter(t=>t.type==='gasto').forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+t.amount; });
    const labels = Object.keys(byCat);
    const data = Object.values(byCat);
    const colors = labels.map(l => CATEGORIES[l]?.color || '#6b7280');
    if (document.getElementById('catChart')) {
      new Chart(document.getElementById('catChart'), {
        type:'doughnut', data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:2, borderColor:'var(--card)' }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }
      });
    }
  }

  if (page === 'reports') {
    const monthTx = getMonthTxs();
    const byCat = {};
    monthTx.filter(t=>t.type==='gasto').forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+t.amount; });
    const labels = Object.keys(byCat);
    const data = Object.values(byCat);
    const colors = labels.map(l => CATEGORIES[l]?.color || '#6b7280');

    if (document.getElementById('pieChart')) {
      new Chart(document.getElementById('pieChart'), {
        type:'pie', data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:2, borderColor:'var(--card)' }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }
      });
    }
    if (document.getElementById('barChart')) {
      new Chart(document.getElementById('barChart'), {
        type:'bar', data:{ labels, datasets:[{ label:'Gastos', data, backgroundColor:colors }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ ticks:{ callback:v=>'$'+v.toLocaleString('es-MX') } } } }
      });
    }
    if (document.getElementById('lineChart')) {
      const months = ['Ago','Sep','Oct','Nov','Dic','Ene'];
      new Chart(document.getElementById('lineChart'), {
        type:'line',
        data:{ labels: months, datasets:[
          { label:'Ingresos', data:[14000,13500,15000,14500,16000,17000], borderColor:'#22c77a', backgroundColor:'rgba(34,199,122,.1)', fill:true, tension:.4 },
          { label:'Gastos', data:[11000,12000,12500,11800,13200,14000], borderColor:'#e84040', backgroundColor:'rgba(232,64,64,.1)', fill:true, tension:.4 }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top' } }, scales:{ y:{ ticks:{ callback:v=>'$'+v.toLocaleString('es-MX') } } } }
      });
    }
  }
}

// Modal
function showModal() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('txDate').value = today;
  document.getElementById('txDesc').value = '';
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';
  document.getElementById('addModal').style.display = 'flex';
}

document.getElementById('closeModal').onclick = () => document.getElementById('addModal').style.display = 'none';
document.getElementById('cancelModal').onclick = () => document.getElementById('addModal').style.display = 'none';
document.getElementById('addModal').addEventListener('click', e => { if(e.target===e.currentTarget) e.currentTarget.style.display='none'; });

document.querySelectorAll('.tab[data-type]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab[data-type]').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    addType = tab.dataset.type;
  });
});

document.getElementById('saveTransaction').addEventListener('click', () => {
  const desc = document.getElementById('txDesc').value.trim();
  const amount = parseFloat(document.getElementById('txAmount').value);
  const cat = document.getElementById('txCat').value;
  const date = document.getElementById('txDate').value;
  const note = document.getElementById('txNote').value.trim();
  if (!desc || !amount || !date) { alert('Completa todos los campos obligatorios'); return; }
  const newTx = { id: Date.now(), type: addType, desc, amount, cat, date, note };
  transactions.unshift(newTx);
  saveTx();
  document.getElementById('addModal').style.display = 'none';
  navigate(currentPage);
});

window.deleteTx = (id) => {
  if (!confirm('¿Eliminar esta transacción?')) return;
  transactions = transactions.filter(t => t.id !== id);
  saveTx();
  navigate(currentPage);
};

// Navigation
document.querySelectorAll('[data-page]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});

document.getElementById('themeToggle').addEventListener('click', () => {
  const dark = document.body.dataset.theme === 'dark';
  document.body.dataset.theme = dark ? '' : 'dark';
  localStorage.setItem('gs_theme', dark ? '' : 'dark');
  document.getElementById('themeToggle').textContent = dark ? '🌙' : '☀️';
});

// Init
if (localStorage.getItem('gs_theme') === 'dark') {
  document.body.dataset.theme = 'dark';
  document.getElementById('themeToggle').textContent = '☀️';
}
navigate('dashboard');
</script>
</body>
</html>
