<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GastoSmart 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0d0f1a;--surface:#13162b;--surface2:#1a1e35;--surface3:#212640;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#f0f2ff;--muted:#7b82a8;--muted2:#4a5080;--accent:#7c6fff;--accent2:#a78bfa;--green:#34d399;--green2:#10b981;--red:#f87171;--amber:#fbbf24;--pink:#f472b6;--cyan:#22d3ee;--r:16px;--rs:10px;--rxl:24px;--transition:.25s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:.15;filter:blur(90px)}
.orb1{width:500px;height:500px;background:#7c6fff;top:-180px;left:-120px}
.orb2{width:400px;height:400px;background:#34d399;bottom:-120px;right:-100px}
.orb3{width:280px;height:280px;background:#f472b6;top:45%;left:42%}
nav{position:sticky;top:0;z-index:100;background:rgba(13,15,26,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.3px}
.logo-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c6fff,#34d399);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7c6fff,#f472b6);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--border2)}
.btn-ghost{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;padding:8px;border-radius:10px;transition:all var(--transition);display:flex;align-items:center}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.layout{display:flex;min-height:calc(100vh - 64px);position:relative;z-index:1}
.sidebar{width:230px;flex-shrink:0;background:rgba(13,15,26,.6);backdrop-filter:blur(12px);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;padding:14px 14px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;width:100%;text-align:left;transition:all var(--transition);position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(124,111,255,.15);color:var(--accent2);border:1px solid rgba(124,111,255,.2)}
.nav-dot{position:absolute;right:14px;width:6px;height:6px;border-radius:50%;background:var(--accent);display:none}
.nav-item.active .nav-dot{display:block}
.nav-icon{font-size:17px;width:22px;text-align:center}
.badge-premium{margin-left:auto;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;letter-spacing:.04em}
.main{flex:1;padding:32px 36px;overflow-y:auto}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;transition:border-color var(--transition)}
.card:hover{border-color:var(--border2)}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:all var(--transition);position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r) var(--r) 0 0}
.metric-card.income::before{background:var(--green)}
.metric-card.expense::before{background:var(--red)}
.metric-card.balance::before{background:var(--accent)}
.metric-card.savings::before{background:var(--amber)}
.metric-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.m-icon{font-size:26px;margin-bottom:12px}
.m-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.m-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:5px}
.m-change{font-size:11px;display:flex;align-items:center;gap:4px}
.up{color:var(--red)}.down{color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.section-title{font-size:14px;font-weight:700;margin-bottom:18px;color:var(--text);display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition);border:none;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#7c6fff,#6050e0);color:#fff;box-shadow:0 4px 15px rgba(124,111,255,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,111,255,.4)}
.btn-outline{background:var(--surface2);border:1px solid var(--border2);color:var(--text)}
.btn-outline:hover{background:var(--surface3)}
.btn-danger{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:9px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.07em}
.form-input{width:100%;padding:11px 15px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;font-size:14px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;transition:border-color var(--transition),box-shadow var(--transition);outline:none}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,111,255,.15)}
.form-input::placeholder{color:var(--muted2)}
select.form-input{cursor:pointer}
select.form-input option{background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:600}
.chip-green{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.chip-red{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.chip-purple{background:rgba(124,111,255,.15);color:var(--accent2);border:1px solid rgba(124,111,255,.2)}
.progress-wrap{height:6px;background:var(--surface3);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border);text-align:left}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--transition)}
tbody tr:hover td{background:var(--surface2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity var(--transition)}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:30px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;transform:translateY(20px) scale(.97);transition:transform var(--transition)}
.modal-bg.open .modal{transform:translateY(0) scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
.type-toggle{display:flex;gap:8px;background:var(--surface2);padding:5px;border-radius:14px;margin-bottom:22px}
.type-btn{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:all var(--transition);font-family:'Plus Jakarta Sans',sans-serif}
.type-btn.ag{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff}
.type-btn.ai{background:linear-gradient(135deg,#34d399,#10b981);color:#fff}
.alert{padding:14px 18px;border-radius:14px;font-size:13px;line-height:1.6;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.alert-warning{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2)}
.alert-success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}
.alert-info{background:rgba(124,111,255,.1);border:1px solid rgba(124,111,255,.2)}
.alert-danger{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2)}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.tx-item{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-cat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx-desc{font-size:13px;font-weight:600;margin-bottom:2px}
.tx-meta{font-size:11px;color:var(--muted)}
.tx-amount{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;margin-left:auto;white-space:nowrap}
.plan-card{border-radius:20px;padding:26px;border:1px solid var(--border);background:var(--surface)}
.plan-card.featured{border:2px solid var(--accent);background:rgba(124,111,255,.08)}
.plan-price{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:800;letter-spacing:-1px}
.plan-feature{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border)}
.plan-feature:last-child{border-bottom:none}
.budget-item{margin-bottom:18px}
.budget-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.budget-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,26,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0;z-index:100}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mob-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 12px;border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;transition:color var(--transition)}
.mob-item .mi{font-size:20px}
.mob-item.active{color:var(--accent2)}
.score-wrap{display:flex;align-items:center;gap:24px}
.ring-bg{fill:none;stroke:var(--surface3);stroke-width:8}
.ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .4s ease forwards}
@media(max-width:1100px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.sidebar{display:none}.main{padding:20px 16px;padding-bottom:90px}.mobile-nav{display:block}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.metrics-grid{grid-template-columns:1fr 1fr}.top-row{flex-direction:column}}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<nav>
  <div class="nav-brand"><div class="logo-icon">💰</div>GastoSmart</div>
  <div class="nav-right">
    <span class="nav-pill">Beta v1.0</span>

</nav>
<div class="layout">
  <aside class="sidebar">
    <div class="nav-section">Principal</div>
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">🏠</span>Dashboard<span class="nav-dot"></span></button>

    <button class="nav-item" data-page="budget"><span class="nav-icon">🎯</span>Presupuesto</button>
    <button class="nav-item" data-page="reports"><span class="nav-icon">📊</span>Reportes</button>
    <div class="nav-section">Herramientas</div>
    <button class="nav-item" data-page="ai"><span class="nav-icon">🤖</span>Asistente IA</button>

    <button class="mob-item" data-page="budget"><span class="mi">🎯</span>Budget</button>
    <button class="mob-item" data-page="reports"><span class="mi">📊</span>Reportes</button>
    <button class="mob-item" data-page="ai"><span class="mi">🤖</span>IA</button>
  </div>
</nav>
<div id="addModal" class="modal-bg">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">Nueva transacción</span><button class="btn-ghost" id="closeModal">✕</button></div>
    <div class="type-toggle">
      <button class="type-btn ag" data-type="gasto">💸 Gasto</button>
      <button class="type-btn" data-type="ingreso">💵 Ingreso</button>
    </div>
    <div class="form-group"><label class="form-label">Descripción</label><input class="form-input" id="txDesc" placeholder="ej. Supermercado, Gasolina..."></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="form-group"><label class="form-label">Monto (MXN)</label><input class="form-input" id="txAmount" type="number" placeholder="0.00" min="0" step="0.01"></div>
      <div class="form-group"><label class="form-label">Fecha</label><input class="form-input" id="txDate" type="date"></div>
    </div>
    <div class="form-group"><label class="form-label">Categoría</label>
      <select class="form-input" id="txCat">
        <option value="Alimentación">🍔 Alimentación</option>
        <option value="Transporte">🚗 Transporte</option>
        <option value="Vivienda">🏠 Vivienda</option>
        <option value="Salud">🏥 Salud</option>
        <option value="Entretenimiento">🎮 Entretenimiento</option>
        <option value="Educación">📚 Educación</option>
        <option value="Ropa">👕 Ropa</option>
        <option value="Servicios">💡 Servicios</option>
        <option value="Ahorro">🐷 Ahorro</option>
        <option value="Otros">📦 Otros</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Nota (opcional)</label><input class="form-input" id="txNote" placeholder="Detalles adicionales..."></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-outline" id="cancelModal">Cancelar</button>
      <button class="btn btn-primary" id="saveTransaction">✓ Guardar</button>
    </div>
  </div>
</div>
<script>
const CATS={
  'Alimentación':{icon:'🍔',color:'#fbbf24',bg:'rgba(251,191,36,.15)'},
  'Transporte':{icon:'🚗',color:'#22d3ee',bg:'rgba(34,211,238,.15)'},
  'Vivienda':{icon:'🏠',color:'#a78bfa',bg:'rgba(167,139,250,.15)'},
  'Salud':{icon:'🏥',color:'#f87171',bg:'rgba(248,113,113,.15)'},
  'Entretenimiento':{icon:'🎮',color:'#34d399',bg:'rgba(52,211,153,.15)'},
  'Educación':{icon:'📚',color:'#22d3ee',bg:'rgba(34,211,238,.15)'},
  'Ropa':{icon:'👕',color:'#f472b6',bg:'rgba(244,114,182,.15)'},
  'Servicios':{icon:'💡',color:'#fbbf24',bg:'rgba(251,191,36,.15)'},
  'Ahorro':{icon:'🐷',color:'#34d399',bg:'rgba(52,211,153,.15)'},
  'Otros':{icon:'📦',color:'#7b82a8',bg:'rgba(123,130,168,.15)'}
};
const BUDGETS={'Alimentación':3000,'Transporte':1500,'Vivienda':9000,'Salud':1000,'Entretenimiento':800,'Educación':2000,'Ropa':1000,'Servicios':500};
const SAMPLE=[
  {id:1,type:'gasto',desc:'Supermercado Walmart',amount:1850,cat:'Alimentación',date:'2025-01-28',note:''},
  {id:2,type:'gasto',desc:'Gasolina PEMEX',amount:650,cat:'Transporte',date:'2025-01-27',note:''},
  {id:3,type:'ingreso',desc:'Salario quincenal',amount:12500,cat:'Otros',date:'2025-01-26',note:'Quincena enero'},
  {id:4,type:'gasto',desc:'Netflix + Spotify',amount:320,cat:'Entretenimiento',date:'2025-01-25',note:''},
  {id:5,type:'gasto',desc:'Farmacia',amount:480,cat:'Salud',date:'2025-01-24',note:'Medicamentos'},
  {id:6,type:'gasto',desc:'Renta departamento',amount:8500,cat:'Vivienda',date:'2025-01-20',note:''},
  {id:7,type:'gasto',desc:'Uniforme escolar',amount:1200,cat:'Educación',date:'2025-01-18',note:''},
  {id:8,type:'ingreso',desc:'Pago freelance',amount:4500,cat:'Otros',date:'2025-01-15',note:'Diseño logo'},
  {id:9,type:'gasto',desc:'Restaurante',amount:890,cat:'Alimentación',date:'2025-01-14',note:''},
  {id:10,type:'gasto',desc:'Metro semanal',amount:210,cat:'Transporte',date:'2025-01-13',note:''}
];
let txs=JSON.parse(localStorage.getItem('gs2_txs')||'null')||SAMPLE;
let page='dashboard',addType='gasto';
function save(){localStorage.setItem('gs2_txs',JSON.stringify(txs))}
function mxn(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0}).format(n)}
function monthTxs(){const now=new Date();return txs.filter(t=>{const d=new Date(t.date+'T00:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()})}
function byCat(list){const r={};list.filter(t=>t.type==='gasto').forEach(t=>{r[t.cat]=(r[t.cat]||0)+t.amount});return r}

function aiTips(cats,income,expense){
  const tips=[];
  const ratio=income>0?expense/income:0;
  const savePct=income>0?Math.round(((income-expense)/income)*100):0;
  if(ratio>.85)tips.push({t:'warning',i:'⚠️',m:'Estás gastando más del 85% de tus ingresos. Intenta reducir gastos no esenciales.'});
  if((cats['Alimentación']||0)>2500)tips.push({t:'info',i:'🍔',m:'Alimentación está por encima del promedio. Cocinar en casa puede reducirlo hasta 40%.'});
  if((cats['Entretenimiento']||0)>500)tips.push({t:'info',i:'🎮',m:'Revisa tus suscripciones. Probablemente hay servicios que ya no usas.'});
  if(savePct<10)tips.push({t:'danger',i:'🐷',m:'Tu ahorro está bajo. La regla 50/30/20 recomienda destinar al menos el 20% de tus ingresos.'});
  if(tips.length===0)tips.push({t:'success',i:'🎉',m:'¡Excelentes finanzas este mes! Estás dentro de los parámetros saludables.'});
  tips.push({t:'info',i:'✨',m:'Activa Premium para recibir análisis predictivo y chat con IA financiera personalizada.'});

function navigate(p){
  page=p;
  document.querySelectorAll('.nav-item,.mob-item').forEach(el=>{
    const a=el.dataset.page===p;
    el.classList.toggle('active',a);
    const dot=el.querySelector('.nav-dot');
    if(dot)dot.style.display=a?'block':'none';
  });
  document.getElementById('mainContent').innerHTML=(PAGES[p]||renderDashboard)();
  afterRender(p);
  window.scrollTo(0,0);
}

function afterRender(p){
  document.getElementById('openAdd')?.addEventListener('click',openModal);
  if(p==='transactions'){
    const filter=()=>{
      const q=document.getElementById('fSearch').value.toLowerCase();
      const type=document.getElementById('fType').value;
      const cat=document.getElementById('fCat').value;
      const f=txs.filter(t=>(!q||t.desc.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q))&&(!type||t.type===type)&&(!cat||t.cat===cat));
      document.getElementById('txTableWrap').innerHTML=txTable(f);
    };
    document.getElementById('fSearch')?.addEventListener('input',filter);
    document.getElementById('fType')?.addEventListener('change',filter);
    document.getElementById('fCat')?.addEventListener('change',filter);
  }
  if(p==='dashboard'){
    const cats=byCat(monthTxs());
    const labels=Object.keys(cats),data=Object.values(cats),colors=labels.map(l=>CATS[l]?.color||'#888');
    const el=document.getElementById('catChart');
    if(el)new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors.map(c=>c+'99'),borderColor:colors,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false}}}});
  }
  if(p==='reports'){
    const cats=byCat(monthTxs()),labels=Object.keys(cats),data=Object.values(cats),colors=labels.map(l=>CATS[l]?.color||'#888');
    const pie=document.getElementById('pieChart');
    if(pie)new Chart(pie,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors.map(c=>c+'bb'),borderColor:'#13162b',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'bottom',labels:{color:'#7b82a8',font:{size:11}}}}}});
    const bar=document.getElementById('barChart');
    if(bar)new Chart(bar,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors.map(c=>c+'99'),borderColor:colors,borderWidth:1,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#7b82a8',font:{size:10}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#7b82a8',callback:v=>'$'+v.toLocaleString('es-MX')},grid:{color:'rgba(255,255,255,.06)'}}}}});
    const line=document.getElementById('lineChart');
    if(line)new Chart(line,{type:'line',data:{labels:['Ago','Sep','Oct','Nov','Dic','Ene'],datasets:[{label:'Ingresos',data:[14000,13500,15000,14500,16000,17000],borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.08)',fill:true,tension:.4,pointBackgroundColor:'#34d399',pointRadius:4},{label:'Gastos',data:[11000,12000,12500,11800,13200,14000],borderColor:'#f87171',backgroundColor:'rgba(248,113,113,.08)',fill:true,tension:.4,pointBackgroundColor:'#f87171',pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#7b82a8'}}},scales:{x:{ticks:{color:'#7b82a8'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#7b82a8',callback:v=>'$'+v.toLocaleString('es-MX')},grid:{color:'rgba(255,255,255,.06)'}}}}});
  }
}

function openModal(){
  document.getElementById('txDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('txDesc').value='';
  document.getElementById('txAmount').value='';
  document.getElementById('txNote').value='';
  document.getElementById('addModal').classList.add('open');
}
document.getElementById('closeModal').onclick=()=>document.getElementById('addModal').classList.remove('open');
document.getElementById('cancelModal').onclick=()=>document.getElementById('addModal').classList.remove('open');
document.getElementById('addModal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});
document.querySelectorAll('.type-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.type-btn').forEach(b=>{b.classList.remove('ag','ai')});
    addType=btn.dataset.type;
    btn.classList.add(addType==='gasto'?'ag':'ai');
  });
});
document.getElementById('saveTransaction').addEventListener('click',()=>{
  const desc=document.getElementById('txDesc').value.trim();
  const amount=parseFloat(document.getElementById('txAmount').value);
  const cat=document.getElementById('txCat').value;
  const date=document.getElementById('txDate').value;
  const note=document.getElementById('txNote').value.trim();
  if(!desc||!amount||!date){alert('Completa descripción, monto y fecha');return}
  txs.unshift({id:Date.now(),type:addType,desc,amount,cat,date,note});
  save();
  document.getElementById('addModal').classList.remove('open');
  navigate(page);
});
window.delTx=id=>{
  if(!confirm('¿Eliminar esta transacción?'))return;
  txs=txs.filter(t=>t.id!==id);save();navigate(page);
};
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));
navigate('dashboard');
</script>
</body>
</html>
